version: '3.8'

services:
  app:
    build: .
    container_name: swift-codes-api
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    env_file:
        - .env

  db:
    image: postgres:16
    container_name: postgres-db
    restart: no
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "swiftuser", "-d", "swiftcodesdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
